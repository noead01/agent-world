[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-contracts"
version = "0.1.0"
description = "Versioned schemas and validation helpers for Agent World"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_world_contracts = ["schemas/*.json"]
